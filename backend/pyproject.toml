[project]
name = "credit-cabinet-backend"
version = "0.1.0"
description = "Умный кредитный кабинет предпринимателя — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<1.15",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "python-multipart>=0.0.12,<0.1",
    "python-jose[cryptography]>=3.3,<4",
    "email-validator>=2.1,<3",
    "bcrypt>=4.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
